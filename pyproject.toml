[project]
name = "integracao-u3"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
